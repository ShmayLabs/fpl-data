name: Pull FPL data

on:
  schedule:
    # Every hour, on the hour (UTC). GitHub may delay this by a few minutes.
    - cron: "0 * * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch FPL data
        env:
          TEAM_ID: "3691289"
        run: |
          set -u
          mkdir -p data
          API="https://fantasy.premierleague.com/api"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"

          get () {  # get <api-path> <outfile>
            if curl -sS -f --max-time 45 -H "User-Agent: $UA" "$API/$1" -o "data/$2.tmp"; then
              mv "data/$2.tmp" "data/$2"
              echo "  ok   $2 ($(du -h data/$2 | cut -f1))"
            else
              rm -f "data/$2.tmp"
              echo "  FAIL $2"
            fi
          }

          get "bootstrap-static/" "bootstrap.json"
          get "fixtures/"         "fixtures.json"
          get "entry/$TEAM_ID/"           "my_entry.json"
          get "entry/$TEAM_ID/history/"   "my_history.json"
          get "entry/$TEAM_ID/transfers/" "my_transfers.json"

          GW=$(python3 -c "
          import json
          d=json.load(open('data/bootstrap.json'))
          nxt=[e['id'] for e in d['events'] if e.get('is_next')]
          cur=[e['id'] for e in d['events'] if e.get('is_current')]
          print(nxt[0] if nxt else (cur[0] if cur else 1))
          ")
          echo "  next gameweek: $GW"

          # Picks become public only after a deadline passes.
          for g in $(seq 1 "$GW"); do
            get "entry/$TEAM_ID/event/$g/picks/" "picks_gw$g.json"
          done

          # Live scoring for the current and previous gameweek
          get "event/$GW/live/" "live_gw$GW.json"
          if [ "$GW" -gt 1 ]; then
            get "event/$((GW-1))/live/" "live_gw$((GW-1)).json"
          fi

          # Mini-league standings, plus every rival's squad in private leagues
          python3 - "$GW" <<'PY'
          import json, sys, urllib.request
          gw = int(sys.argv[1])
          ua = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64)"}

          def api(path):
              req = urllib.request.Request(
                  f"https://fantasy.premierleague.com/api/{path}", headers=ua)
              return json.load(urllib.request.urlopen(req, timeout=30))

          try:
              entry = json.load(open("data/my_entry.json"))
          except Exception:
              raise SystemExit(0)

          leagues, rivals = {}, {}
          for lg in entry.get("leagues", {}).get("classic", []):
              lid = lg["id"]
              try:
                  st = api(f"leagues-classic/{lid}/standings/")
                  leagues[str(lid)] = {"name": lg.get("name"), "standings": st}
                  print(f"  ok   league {lg.get('name')}")
              except Exception as e:
                  print(f"  FAIL league {lg.get('name')}: {e}")
                  continue

              # Only for private leagues (type "x") small enough to be a real
              # rivalry — pull each manager's actual squad.
              if st.get("league", {}).get("league_type") != "x":
                  continue
              rows = st.get("standings", {}).get("results", [])
              if len(rows) > 30:
                  continue
              for r in rows:
                  eid = r["entry"]
                  # Picks are public only once a deadline has passed.
                  for g in range(gw, 0, -1):
                      try:
                          p = api(f"entry/{eid}/event/{g}/picks/")
                          rivals[str(eid)] = {
                              "team": r.get("entry_name"),
                              "manager": r.get("player_name"),
                              "rank": r.get("rank"),
                              "total": r.get("total"),
                              "from_gw": g,
                              "picks": p.get("picks", []),
                              "chip": p.get("active_chip"),
                          }
                          break
                      except Exception:
                          continue
              print(f"  ok   {len(rivals)} rival squads from {lg.get('name')}")

          json.dump(leagues, open("data/my_leagues.json", "w"))
          json.dump(rivals, open("data/rivals.json", "w"))
          PY

      - name: Build digest
        # Never let a digest error block the raw data from being saved.
        run: python3 scripts/digest.py || echo "DIGEST FAILED - raw data still committed"

      - name: Render page
        run: PYTHONPATH=scripts python3 scripts/render.py || echo "RENDER FAILED - data still committed"

      - name: Commit
        run: |
          git config user.name  "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add -A data index.html
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

